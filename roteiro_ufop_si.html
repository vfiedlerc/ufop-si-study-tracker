<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  .page-header { background: #fff; border-bottom: 1px solid var(--border); padding: 20px 32px; position: sticky; top: 0; z-index: 100; }
  .page-header h1 { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
  .page-header p { font-size: 12px; color: var(--muted); }

  .stats-bar { display: flex; gap: 24px; padding: 12px 32px; background: #fff; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
  .stat-val { font-size: 20px; font-weight: 600; color: var(--text); }
  .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .global-bar-wrap { flex: 1; min-width: 120px; }
  .global-bar-bg { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .global-bar { height: 100%; background: var(--blue); border-radius: 3px; transition: width 0.3s; }
  .global-pct { font-size: 12px; color: var(--blue); font-weight: 600; margin-bottom: 3px; }

  .toolbar { padding: 12px 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg); }
  .search { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 220px; background: #fff; color: var(--text); }
  .search:focus { outline: none; border-color: var(--blue); }
  .filter-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: #fff; color: var(--muted); transition: all 0.15s; }
  .filter-btn.active { background: var(--blue-light); color: var(--blue-dark); border-color: var(--blue); font-weight: 500; }
  .btn-reset { margin-left: auto; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; background: #fff; color: var(--muted); }
  .btn-reset:hover { background: #fff0f0; border-color: #e24b4a; color: #a32d2d; }
  .btn-collapse { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; background: #fff; color: var(--muted); }

  .main { padding: 20px 32px 60px; max-width: 960px; }

  .period-group { margin-bottom: 24px; }
  .period-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-left: 2px; }

  .subject-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .subject-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; user-select: none; transition: background 0.1s; }
  .subject-header:hover { background: var(--bg); }
  .expand-icon { font-size: 9px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
  .subject-card.open .expand-icon { transform: rotate(90deg); }
  .subject-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
  .cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; font-weight: 500; }
  .bar-wrap { width: 72px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .bar { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .prog-txt { font-size: 11px; color: var(--muted); white-space: nowrap; min-width: 30px; text-align: right; }

  .topics-body { display: none; border-top: 1px solid var(--border); padding: 8px 14px 12px; }
  .subject-card.open .topics-body { display: block; }

  .topic-row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 4px; border-bottom: 1px solid #f1efe8; }
  .topic-row:last-child { border-bottom: none; }

  .topic-lbl { font-size: 13px; color: var(--text); line-height: 1.4; cursor: pointer; }
  .topic-lbl.done { color: #aaa; text-decoration: line-through; }

  .topics-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px; margin-top: 6px; border-top: 1px solid #f1efe8; }
  .btn-mark-all { padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--muted); transition: all 0.15s; }

  .btn-mark-all.all-done { background: var(--green-light); border-color: var(--green); color: var(--green-dark); font-weight: 500; }
  .btn-unmark-all { padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--muted); transition: all 0.15s; }
  .btn-unmark-all:hover { background: #fff0f0; border-color: #e24b4a; color: #a32d2d; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 32px; border-top: 1px solid var(--border); margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  @media print {
    .toolbar, .btn-reset, .btn-collapse { display: none; }
    .page-header { position: static; }
    .subject-card.open .topics-body, .topics-body { display: block !important; }
    .main { padding: 10px 20px; }
  }
</style>
</head>

function key(sid, i) { return sid + '_' + i; }

function subjDone(s) {
  return { done: s.topics.filter((_,i) => progress[key(s.id,i)]).length, total: s.topics.length };
}

function barColor(pct) {
  if (pct === 100) return '#3B6D11';
  if (pct >= 60) return '#854F0B';
  return '#185FA5';
}

function updateStats() {
  let tS=0, dS=0, tT=0, dT=0;
  DATA.forEach(s => { const p=subjDone(s); tS++; tT+=p.total; dT+=p.done; if(p.done===p.total) dS++; });
  document.getElementById('s-total').textContent = tS;
  document.getElementById('s-done').textContent = dS;
  document.getElementById('s-topics').textContent = tT;
  const pct = tT ? Math.round(dT/tT*100) : 0;
  document.getElementById('s-pct').textContent = pct + '% revisado';
  document.getElementById('global-bar').style.width = pct + '%';
  document.getElementById('global-bar').style.background = barColor(pct);
}

function render() {
  const cat = document.querySelector('.filter-btn.active')?.dataset.cat || 'all';
  const q = document.getElementById('search-inp').value.toLowerCase();
  const container = document.getElementById('main');
  container.innerHTML = '';
  const periods = [...new Set(DATA.map(s=>s.period))];

  periods.forEach(p => {
    const subjects = DATA.filter(s => {
      if (cat !== 'all' && s.cat !== cat) return false;
      if (q && !s.name.toLowerCase().includes(q)) return false;
      return s.period === p;
    });
    if (!subjects.length) return;

    const pg = document.createElement('div');
    pg.className = 'period-group';
    pg.innerHTML = `<div class="period-label">${p}º Período</div>`;

    subjects.forEach(s => {
      const {done, total} = subjDone(s);
      const pct = Math.round(done/total*100);
      const cs = CAT[s.cat];
      const card = document.createElement('div');
      card.className = 'subject-card';
      card.id = 'card-' + s.id;

      const topicsHtml = s.topics.map((t,i) => {
        const k = key(s.id, i);
        const chk = progress[k] ? 'checked' : '';
        return `<div class="topic-row">
          <input type="checkbox" id="${k}" ${chk} onchange="toggleTopic('${k}','${s.id}',this.checked)"/>
          <label class="topic-lbl${chk ? ' done':''}" for="${k}">${t}</label>
        </div>`;
      }).join('');

      const allDone = done === total;
      card.innerHTML = `
        <div class="subject-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="expand-icon">&#9658;</span>
          <span class="subject-name">${s.name}</span>
          <span class="cat-badge" style="background:${cs.bg};color:${cs.color}">${cs.label}</span>
          <div class="bar-wrap"><div class="bar" id="bar-${s.id}" style="width:${pct}%;background:${barColor(pct)}"></div></div>
          <span class="prog-txt" id="prog-${s.id}">${done}/${total}</span>
        </div>
        <div class="topics-body">
          ${topicsHtml}
          <div class="topics-footer">
            <button class="btn-unmark-all" onclick="markAll('${s.id}',false)">Desmarcar todos</button>
            <button class="btn-mark-all${allDone?' all-done':''}" id="markbtn-${s.id}" onclick="markAll('${s.id}',true)">&#10003; Marcar todos como concluido</button>
          </div>
        </div>`;
      pg.appendChild(card);
    });
    container.appendChild(pg);
  });
  updateStats();
}

function toggleTopic(k, sid, val) {
  progress[k] = val;
  save();
  const lbl = document.querySelector(`label[for="${k}"]`);
  if (lbl) lbl.classList.toggle('done', val);
  const s = DATA.find(x => x.id === sid);
  const {done, total} = subjDone(s);
  const pct = Math.round(done/total*100);
  const bar = document.getElementById('bar-'+sid);
  const pt = document.getElementById('prog-'+sid);
  if (bar) { bar.style.width = pct+'%'; bar.style.background = barColor(pct); }
  if (pt) pt.textContent = done+'/'+total;
  updateStats();
}

function markAll(sid, val) {
  const s = DATA.find(x => x.id === sid);
  s.topics.forEach((_, i) => {
    const k = key(sid, i);
    progress[k] = val;
    const chk = document.getElementById(k);
    const lbl = document.querySelector(`label[for="${k}"]`);
    if (chk) chk.checked = val;
    if (lbl) lbl.classList.toggle('done', val);
  });
  save();
  const {done, total} = subjDone(s);
  const pct = Math.round(done/total*100);
  const bar = document.getElementById('bar-'+sid);
  const pt = document.getElementById('prog-'+sid);
  const btn = document.getElementById('markbtn-'+sid);
  if (bar) { bar.style.width = pct+'%'; bar.style.background = barColor(pct); }
  if (pt) pt.textContent = done+'/'+total;
  if (btn) btn.classList.toggle('all-done', val);
  updateStats();
}

function collapseAll() { document.querySelectorAll('.subject-card.open').forEach(c=>c.classList.remove('open')); }
function expandAll() { document.querySelectorAll('.subject-card').forEach(c=>c.classList.add('open')); }

function resetProgress() {
  if (confirm('Resetar todo o progresso? Esta ação não pode ser desfeita.')) {
    localStorage.removeItem('ufop_si_progress');
    progress = {};
    render();
  }
}

document.querySelector('.toolbar').addEventListener('click', e => {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    render();
  }
});
document.getElementById('search-inp').addEventListener('input', render);

render();
</script>
</body>
</html>
